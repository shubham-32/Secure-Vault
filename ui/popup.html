<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SecureVault</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self';" />
   <link rel="stylesheet" href="../src/styles.css" />
  <style>
    /* tiny helper used for the setup block visibility */
    .hidden { display: none !important; }
    /* small setup-specific tweaks to match existing look */
    .setup-box { width:100%; max-width:420px; margin-top:12px; }
    .setup-row { margin-top:8px; display:flex; gap:8px; align-items:center; }
    .setup-row input { flex:1; }
    .setup-note { font-size:12px; color:#94a3b8; margin-top:6px; }
    .setup-error { color:#f87171; margin-top:8px; font-size:13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 1 1 12 0v3H6v-3Z" stroke="white" stroke-width="1.6"/><rect x="8" y="13" width="8" height="7" rx="2" stroke="white" stroke-width="1.6"/></svg>
        </div>
        <div class="title"><b>SecureVault</b><span>Password Manager</span></div>
      </div>
      <div class="actions">
        <button id="addBtn" class="icon-btn" title="Add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button id="settingsBtn" class="icon-btn" title="Settings"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 8v8M8 12h8" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9.2" stroke="#cbd5e1" stroke-width="1.6" fill="none"/></svg></button>
        <!-- Lock button (visible when unlocked) -->
        <button id="lockBtn" class="icon-btn hidden" title="Lock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 1 1 12 0v3H6v-3Z" stroke="#cbd5e1" stroke-width="1.6"/><rect x="8" y="13" width="8" height="7" rx="2" stroke="#cbd5e1" stroke-width="1.6"/></svg></button>
      </div>
    </div>

    <!-- Locked view -->
    <div id="lockedView" class="section">
      <div class="center">
        <div class="lock-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 1 1 12 0v3H6v-3Z" stroke="white" stroke-width="1.6"/><rect x="8" y="13" width="8" height="7" rx="2" stroke="white" stroke-width="1.6"/></svg></div>
        <div class="h1">Unlock Your Vault</div>
        <div class="muted">Enter your master password to access your<br/>passwords</div>

        <!-- Setup block: shown only for first-run (needsSetup) -->
        <div id="setupBlock" class="setup-box hidden" aria-live="polite">
          <div style="font-weight:600; margin-bottom:8px;">Set a master password</div>
          <div class="setup-row">
            <input id="masterSetInput" type="password" placeholder="Create master password" autocomplete="new-password" />
          </div>
          <div class="setup-row">
            <input id="masterConfirm" type="password" placeholder="Confirm master password" autocomplete="new-password" />
          </div>
          <div class="setup-note">Create a strong master password. This password is never stored and is required to unlock your vault.</div>
          <div style="margin-top:10px; display:flex; gap:8px;">
            <button id="setMasterBtn" class="btn btn-primary" style="flex:1;">Set master password</button>
          </div>
          <div id="setupMsg" class="setup-error" role="status"></div>
        </div>

        <!-- Normal unlock UI -->
        <div id="unlockBlock" class="setup-box">
          <div class="input-with-icon" style="width:100%; margin-top:14px;">
            <input id="masterInput" type="password" placeholder="Master password" autocomplete="current-password" />
            <button id="toggleMaster" class="right" title="Show/Hide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12s3.5-7 9-7 9 7 9 7-3.5 7-9 7-9-7-9-7Z" stroke="#94a3b8" stroke-width="1.7"/><circle cx="12" cy="12" r="3" stroke="#94a3b8" stroke-width="1.7"/></svg></button>
          </div>

          <!-- Remember session toggle -->
          <div style="width:100%; margin-top:8px; display:flex; align-items:center; gap:8px;">
            <input id="rememberCheckbox" type="checkbox" />
            <label for="rememberCheckbox" style="font-size:13px;color:#94a3b8">Remember session (keep unlocked until timer)</label>
          </div>

          <div class="actions-row" style="width:100%; margin-top:10px;">
            <button id="unlockBtn" class="btn btn-primary" style="width:100%;">Unlock Vault</button>
          </div>
          <div id="unlockMsg" class="small" style="color:#f87171;margin-top:8px;"></div>
        </div>
      </div>
    </div>

    <!-- Unlocked Vault view -->
    <div id="vaultView" class="section hidden">
      <div style="display:flex; align-items:center; gap:-24px">
        <div class="input-with-icon" style="flex:1">
          <input id="searchInput" style="min-width:164px;" placeholder="Search credentials..." />
          <div class="right" style="margin-left:4"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="m21 21-4-4" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="7" stroke="#64748b" stroke-width="2"/></svg></div>
        </div>
        <div id="sessionTimer" style="min-width:140px; text-align:right; font-size:12px; color:#94a3b8;"></div>
      </div>

      <div class="chips" style="margin-top:8px;">
        <button class="chip active" data-filter="all">All Credentials</button>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="center hidden">
        <button id="bigAdd" class="icon-btn" style="width:76px;height:76px;border-radius:24px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/></svg></button>
        <div class="muted">No passwords saved yet</div>
        <button id="firstAdd" class="btn btn-primary">Add Your First Password</button>
      </div>
    </div>

    <!-- Add / Edit modal (inline simple form) -->
    <div id="editor" class="section hidden">
      <div class="h1" id="editorTitle">Add Credential</div>
      <div class="grid">
        <div>
          <label>Site Name</label>
          <input id="eSite" placeholder="Google" />
        </div>
        <div>
          <label>URL</label>
          <input id="eUrl" placeholder="https://example.com" />
        </div>
        <div>
          <label>Username</label>
          <input id="eUser" placeholder="name@example.com" autocomplete="username" />
        </div>
        <div class="row" style="gap:8px;">
          <div style="flex:1;">
            <label>Password</label>
            <input id="ePass" type="password" placeholder="••••••••" autocomplete="new-password" />
          </div>
          <button id="genPass" class="btn btn-secondary" title="Generate">Generate</button>
        </div>
      </div>
      <div class="actions-row">
        <button id="saveCredential" class="btn btn-primary" style="flex:1;">Save</button>
        <button id="cancelEdit" class="btn btn-outline" style="flex:1;">Cancel</button>
      </div>
    </div>

    <div class="footer"><span>🔒 End-to-end encrypted</span></div>
  </div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
